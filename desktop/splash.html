<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TOEFL Practice</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: #f6f6f3; color: #16181d; font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        border: 1px solid #e2e2dd; box-sizing: border-box; -webkit-app-region: drag; user-select: none;
      }
      img { width: 64px; height: 64px; }
      h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
      p { margin: 0; font-size: 13px; color: #737985; }
      .bar { width: 160px; height: 3px; border-radius: 3px; background: #e2e2dd; overflow: hidden; }
      .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #1d3f72; animation: slide 1.1s ease-in-out infinite; }
      @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    </style>
  </head>
  <body>
    <img src="build-resources/icon.png" alt="" />
    <h1>TOEFL Practice</h1>
    <div class="bar"></div>
    <p>Starting…</p>
  </body>
</html>
